[package]
name = "ninjask"
version = "0.1.0"
edition = "2021"
authors = ["waldhari"]
description = "High-performance CSV explorer TUI with virtual scrolling"

[dependencies]
# Data engine - Polars with required features
polars = { version = "0.46", features = ["lazy", "csv", "strings", "regex"] }

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Input widget for search bar
tui-input = "0.11"

# Error handling
anyhow = "1.0"

# Regex for search escaping
regex = "1.12"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Temporary directory for tests
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
